<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>无休夏日综合征 · 制作时间线</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:linear-gradient(rgba(10,14,23,0.88),rgba(10,14,23,0.88)),url('main_cap.png') center/cover no-repeat fixed #0a0e17;color:#e2e8f0;font-family:'Noto Sans SC',system-ui,sans-serif;overflow-x:hidden}
  .header{padding:24px 28px 16px;border-bottom:1px solid #1e293b}
  .header-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
  .header h1{font-size:20px;font-weight:700;letter-spacing:-0.5px;color:#f8fafc}
  .header .subtitle{font-size:12px;color:#64748b;margin-top:4px}
  .mode-badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;margin-left:8px}
  .mode-admin{background:#22c55e20;color:#22c55e;border:1px solid #22c55e40}
  .mode-viewer{background:#3b82f620;color:#3b82f6;border:1px solid #3b82f640}
  .sync-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px}
  .sync-ok{background:#22c55e}
  .sync-loading{background:#f59e0b;animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
  .controls{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
  .filter-btn{padding:4px 10px;font-size:11px;font-weight:500;background:transparent;color:#64748b;border:1px solid #1e293b;border-radius:5px;cursor:pointer;font-family:inherit;transition:all 0.2s;display:flex;align-items:center;gap:4px}
  .filter-btn.active{background:#1e293b;color:#f8fafc;border-color:#334155}
  .filter-btn:hover{border-color:#334155}
  .filter-dot{width:6px;height:6px;border-radius:50%}
  .btn-add{padding:4px 10px;font-size:11px;font-weight:600;background:#22c55e20;color:#22c55e;border:1px solid #22c55e40;border-radius:5px;cursor:pointer;font-family:inherit;transition:all 0.2s;margin-left:4px}
  .btn-add:hover{background:#22c55e30;border-color:#22c55e60}
  .legend{display:flex;gap:14px;margin-top:12px;font-size:11px;color:#94a3b8;flex-wrap:wrap;align-items:center}
  .legend-item{display:flex;align-items:center;gap:4px}
  .legend-dot{width:7px;height:7px;border-radius:50%}
  .legend-lock{width:9px;height:9px;border-radius:2px;border:1.5px dashed #f59e0b}
  .save-note{font-size:10px;color:#334155;margin-left:auto}

  .action-panel{padding:12px 28px;background:#111827;border-bottom:1px solid #1e293b;display:none;align-items:center;gap:10px;font-size:13px;flex-wrap:wrap}
  .action-panel.visible{display:flex}
  .panel-input{background:#1e293b;border:1px solid #334155;color:#f8fafc;padding:4px 8px;border-radius:4px;font-size:13px;font-family:inherit}
  .panel-input-wide{min-width:200px}
  .panel-input-note{min-width:140px}
  .action-panel select{background:#1e293b;border:1px solid #334155;color:#f8fafc;padding:4px 8px;border-radius:4px;font-size:13px;font-family:inherit}
  .action-panel label{color:#94a3b8;font-size:12px;display:flex;align-items:center;gap:4px;cursor:pointer}
  .action-panel input[type="checkbox"]{accent-color:#3b82f6}
  .panel-label{color:#94a3b8;font-size:12px;flex-shrink:0}
  .btn-confirm{padding:4px 14px;background:#3b82f6;color:#fff;border:none;border-radius:4px;font-size:12px;cursor:pointer;font-family:inherit}
  .btn-cancel{padding:4px 14px;background:transparent;color:#94a3b8;border:1px solid #334155;border-radius:4px;font-size:12px;cursor:pointer;font-family:inherit}

  .timeline-scroll{overflow-x:auto;overflow-y:auto;position:relative}
  .timeline-canvas{position:relative;padding:0 0 40px}
  .month-bar{position:sticky;top:0;z-index:20;background:#0a0e17;border-bottom:1px solid #1e293b;height:40px}
  .month-label{position:absolute;padding:10px 12px;font-size:13px;font-weight:600;color:#64748b;border-right:1px solid #1e293b;height:40px}
  .month-label.current{color:#f8fafc;background:rgba(59,130,246,0.06)}
  .grid-line{position:absolute;top:40px;bottom:0;width:1px;background:#1e293b}
  .today-line{position:absolute;top:36px;bottom:0;width:2px;background:linear-gradient(180deg,#f59e0b 0%,rgba(245,158,11,0.1) 100%);z-index:15}
  .today-label{position:absolute;top:40px;z-index:16;background:#f59e0b;color:#000;font-size:10px;font-weight:700;padding:2px 6px;border-radius:3px;white-space:nowrap}

  .event-node{position:absolute;z-index:10;user-select:none;transition:left 0.3s ease,top 0.3s ease}
  .event-node.dragging{z-index:30;transition:none}
  .event-node.draggable{cursor:grab}
  .event-node.draggable:active{cursor:grabbing}
  .event-stem{position:absolute;left:3px;top:-4px;width:2px;height:12px;opacity:0.4}
  .event-dot{width:8px;height:8px;border-radius:50%;border-width:2px;border-style:solid}
  .event-card{position:absolute;top:14px;left:-6px;border-radius:6px;padding:5px 9px;min-width:125px;max-width:175px;transition:box-shadow 0.2s}
  .event-node.dragging .event-card{box-shadow:0 4px 20px rgba(0,0,0,0.4)}
  .event-card .date-label{font-size:10px;color:#94a3b8;margin-bottom:1px;font-family:'JetBrains Mono',monospace;display:flex;align-items:center;gap:4px}
  .event-card .type-badge{font-size:9px;padding:0 4px;border-radius:3px;font-weight:600;letter-spacing:0.3px}
  .event-card .event-title{font-size:11px;font-weight:500;line-height:1.35;color:#e2e8f0;word-break:break-word;overflow-wrap:break-word}
  .event-card .event-title.important{font-weight:700;color:#f8fafc}
  .event-card .event-note{font-size:9px;color:#94a3b8;margin-top:1px;line-height:1.3;word-break:break-word;overflow-wrap:break-word}
  .lock-icon{color:#f59e0b;font-size:9px}

  .event-list{padding:20px 28px;border-top:1px solid #1e293b}
  .event-list h2{font-size:14px;font-weight:600;color:#94a3b8;margin-bottom:12px;letter-spacing:0.5px;text-transform:uppercase}
  .list-row{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:4px;font-size:13px;transition:background 0.15s}
  .list-row:hover{background:rgba(30,41,59,0.5)}
  .list-row.selected-row{background:#1e293b}
  .list-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
  .list-badge{font-size:10px;padding:1px 5px;border-radius:3px;font-weight:600;flex-shrink:0;min-width:28px;text-align:center}
  .list-date{font-family:'JetBrains Mono',monospace;font-size:12px;min-width:44px}
  .list-date.editable{color:#e2e8f0;cursor:pointer;text-decoration:underline;text-decoration-color:#334155;text-underline-offset:2px}
  .list-date.locked{color:#94a3b8}
  .list-label{color:#e2e8f0;flex:1}
  .list-label.important{color:#f8fafc;font-weight:600}
  .list-label.editable-label{cursor:pointer}
  .list-label.editable-label:hover{text-decoration:underline;text-decoration-color:#334155;text-underline-offset:2px}
  .list-note{font-size:11px;color:#94a3b8}
  .btn-del{width:20px;height:20px;border-radius:4px;border:none;background:transparent;color:#475569;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;flex-shrink:0;font-family:inherit;line-height:1}
  .btn-del:hover{background:#ef444420;color:#ef4444}
</style>
</head>
<body>

<div class="header">

    <div>
      <h1>无休夏日综合征 · 制作时间线 <span class="mode-badge" id="modeBadge"></span></h1>

<!-- Edit panel -->

  <label><input type="checkbox" id="editFixed"> 锁定</label>
  <label><input type="checkbox" id="editImportant"> 重要</label>

  <button class="btn-confirm" id="editConfirm">确认</button>
  <button class="btn-cancel" id="editCancel">取消</button>
</div>

<!-- Add panel -->
<div class="action-panel" id="addPanel">
  <span style="color:#22c55e;font-weight:600">+ 新事件</span>
  <input type="date" class="panel-input" id="addDate">
  <input type="text" class="panel-input panel-input-wide" id="addLabel" placeholder="事件名称">
  <select id="addType"><option value="dev">综合</option><option value="script">剧本</option><option value="art">美术</option><option value="music">音乐</option><option value="voice">配音</option><option value="marketing">宣发</option><option value="launch">发售</option></select>
  <label><input type="checkbox" id="addFixed"> 锁定</label>
  <label><input type="checkbox" id="addImportant"> 重要</label>
  <input type="text" class="panel-input panel-input-note" id="addNote" placeholder="备注（可选）">
  <button class="btn-confirm" id="addConfirm">添加</button>
  <button class="btn-cancel" id="addCancel">取消</button>
</div>

<div class="timeline-scroll" id="timelineScroll">
  <div class="timeline-canvas" id="timelineCanvas"></div>
</div>

<div class="event-list">
  <h2 id="listHeader">事件列表</h2>
  <div id="eventListContainer"></div>
</div>

<script>
const DB_URL='https://ess-timeline-default-rtdb.firebaseio.com';
const IS_ADMIN=new URLSearchParams(window.location.search).has('admin');
const POLL_INTERVAL=IS_ADMIN?30000:15000;

if(IS_ADMIN){document.getElementById('modeBadge').className='mode-badge mode-admin';document.getElementById('modeBadge').textContent='管理员'}
document.getElementById('listHeader').textContent=IS_ADMIN?'事件列表 · 点击名称或日期编辑 · 拖拽调整 · × 删除':'事件列表';

const TYPES={
  script:{label:"剧本",color:"#06b6d4",bg:"#0c2a33",badgeBg:"rgba(6,182,212,0.15)"},
  art:{label:"美术",color:"#ec4899",bg:"#2d1527",badgeBg:"rgba(236,72,153,0.15)"},
  music:{label:"音乐",color:"#f59e0b",bg:"#2a1f0d",badgeBg:"rgba(245,158,11,0.15)"},
  voice:{label:"配音",color:"#22c55e",bg:"#0d2818",badgeBg:"rgba(34,197,94,0.15)"},
  marketing:{label:"宣发",color:"#a855f7",bg:"#2a1f35",badgeBg:"rgba(168,85,247,0.15)"},
  dev:{label:"综合",color:"#3b82f6",bg:"#1a2744",badgeBg:"rgba(59,130,246,0.15)"},
  launch:{label:"发售",color:"#ef4444",bg:"#3b1c1c",badgeBg:"rgba(239,68,68,0.15)"},
};
const FILTERS=[{key:"all",label:"全部"},{key:"script",label:"剧本"},{key:"art",label:"美术"},{key:"music",label:"音乐"},{key:"voice",label:"配音"},{key:"marketing",label:"宣发"},{key:"dev",label:"综合"}];

const INITIAL_EVENTS=[
  {id:1,date:"2026-05-16",label:"商店页Coming Soon上线",type:"marketing",fixed:true},
  {id:2,date:"2026-05-31",label:"编辑确定并开始工作",type:"script",fixed:false,note:"优先demo部分"},
  {id:3,date:"2026-05-18",label:"杂谈第一批开始发布",type:"marketing",fixed:false,note:"每周一篇，共3-5篇"},
  {id:28,date:"2026-05-20",label:"Kevin优先交付demo用BGM",type:"music",fixed:false},
  {id:4,date:"2026-06-07",label:"Demo完成（除配音外）",type:"dev",fixed:false,important:true},
  {id:5,date:"2026-06-15",label:"观察六月Next Fest",type:"marketing",fixed:true,note:"6/15-6/22"},
  {id:29,date:"2026-06-20",label:"CV物色开始",type:"voice",fixed:false,note:"听demo reel/建立判断标准"},
  {id:6,date:"2026-07-01",label:"宣发美工第一批素材交付",type:"art",fixed:false,note:"capsule排版/社媒模板"},
  {id:7,date:"2026-07-15",label:"全本剧本定稿",type:"script",fixed:false,important:true},
  {id:30,date:"2026-07-20",label:"CV试音+正式接触",type:"voice",fixed:false},
  {id:8,date:"2026-08-15",label:"CV选定确认",type:"voice",fixed:false,important:true},
  {id:9,date:"2026-08-28",label:"Demo配音完成",type:"voice",fixed:false},
  {id:10,date:"2026-08-31",label:"Trailer完成",type:"marketing",fixed:false},
  {id:11,date:"2026-09-01",label:"Curator软接触开始",type:"marketing",fixed:false},
  {id:12,date:"2026-09-07",label:"Steam拉取trailer",type:"dev",fixed:true,note:"硬性deadline"},
  {id:13,date:"2026-09-14",label:"itch.io demo上线",type:"marketing",fixed:false,note:"前哨站"},
  {id:14,date:"2026-09-21",label:"Demo build提交Steam审核",type:"dev",fixed:true,note:"Press Preview"},
  {id:15,date:"2026-09-25",label:"宣发美工第二批素材交付",type:"art",fixed:false,note:"Next Fest物料"},
  {id:16,date:"2026-10-01",label:"Curator正式发key",type:"marketing",fixed:false},
  {id:17,date:"2026-10-05",label:"Next Fest素材最终提交",type:"dev",fixed:true,note:"硬性deadline"},
  {id:18,date:"2026-10-19",label:"★ Steam Next Fest",type:"marketing",fixed:true,important:true,note:"10/19-10/26 全力运营"},
  {id:19,date:"2026-10-28",label:"Next Fest复盘+杂谈第二批",type:"marketing",fixed:false},
  {id:20,date:"2026-11-15",label:"全部游戏内美术完成",type:"art",fixed:false,important:true},
  {id:21,date:"2026-11-24",label:"音乐创作完成→混音母带开始",type:"music",fixed:true,important:true,note:"与Kevin约定"},
  {id:31,date:"2026-11-01",label:"全本配音录制开始",type:"voice",fixed:false},
  {id:22,date:"2026-12-01",label:"正式版review key发送",type:"marketing",fixed:false,note:"KOL/curator"},
  {id:23,date:"2026-12-15",label:"全部配音完成",type:"voice",fixed:false,important:true},
  {id:24,date:"2026-12-28",label:"正式版内容完成",type:"dev",fixed:false,important:true},
  {id:25,date:"2027-01-05",label:"混音母带完成+正式版送审",type:"music",fixed:true,important:true},
  {id:26,date:"2027-01-08",label:"发售倒计时宣传",type:"marketing",fixed:false,note:"社媒+杂谈收尾"},
  {id:27,date:"2027-01-19",label:"🚀 发售",type:"launch",fixed:true,important:true},
];

let events=JSON.parse(JSON.stringify(INITIAL_EVENTS));
let nextId=100,filter="all",selectedId=null,dragState=null;

const START=new Date("2026-05-01"),END=new Date("2027-02-01");
const TOTAL_DAYS=Math.ceil((END-START)/86400000);
const TOTAL_WIDTH=2400;
const DRAG_SNAP=10;
const CARD_W=170;
const CARD_GAP=8;
const MONTH_NAMES=["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];

function daysBetween(a,b){return Math.ceil((b-a)/86400000)}
function dateToPos(d){return(daysBetween(START,new Date(d))/TOTAL_DAYS)*TOTAL_WIDTH}
function posToDate(x){const d=Math.round((x/TOTAL_WIDTH)*TOTAL_DAYS);const r=new Date(START);r.setDate(r.getDate()+d);return r.toISOString().slice(0,10)}
function formatDate(s){const d=new Date(s+"T00:00:00");return`${d.getMonth()+1}/${d.getDate()}`}
function getMonths(){const m=[];let c=new Date(START);while(c<END){m.push(new Date(c));c=new Date(c.getFullYear(),c.getMonth()+1,1)}return m}
function getFiltered(){return events.filter(ev=>{if(filter==="all")return true;if(ev.type==="launch")return true;return ev.type===filter}).sort((a,b)=>a.date.localeCompare(b.date))}

function measureCardHeights(evts){
  const wrap=document.createElement('div');
  wrap.style.cssText='position:absolute;left:0;top:-99999px;visibility:hidden';
  document.body.appendChild(wrap);
  const heights={};
  evts.forEach(ev=>{
    const t=TYPES[ev.type];
    const card=document.createElement('div');
    card.className='event-card';
    card.style.cssText=`position:static;background:${t.bg};border:1px solid ${t.color}40`;
    let inner=`<div class="date-label">${formatDate(ev.date)}<span class="type-badge" style="background:${t.badgeBg};color:${t.color}">${t.label}</span>${ev.fixed?'<span class="lock-icon">🔒</span>':''}</div>`;
    inner+=`<div class="event-title${ev.important?' important':''}">${ev.label}</div>`;
    if(ev.note)inner+=`<div class="event-note">${ev.note}</div>`;
    card.innerHTML=inner;
    wrap.appendChild(card);
    heights[ev.id]=card.offsetHeight+14;
    wrap.removeChild(card);
  });
  document.body.removeChild(wrap);
  return heights;
}

function layoutEvents(evts,heights){
  const placed=[];
  const result=evts.map(ev=>{
    if(typeof ev.customTop==='number'){
      const x=dateToPos(ev.date);const h=heights[ev.id];
      placed.push({left:x-10,right:x+CARD_W,top:ev.customTop,bottom:ev.customTop+h,id:ev.id});
      return{...ev,pxTop:ev.customTop};
    }
    return{...ev,pxTop:-1};
  });
  for(let i=0;i<result.length;i++){
    if(result[i].pxTop!==-1)continue;
    const ev=result[i];const x=dateToPos(ev.date);const h=heights[ev.id];
    const left=x-10,right=x+CARD_W;
    const hOverlaps=placed.filter(p=>left<p.right&&right>p.left);
    let y=0;
    if(hOverlaps.length>0){
      hOverlaps.sort((a,b)=>a.top-b.top);
      let settled=false;
      const noOverlapAt=yy=>!hOverlaps.some(p=>yy<p.bottom+CARD_GAP&&yy+h>p.top-CARD_GAP);
      if(noOverlapAt(0)){settled=true;y=0}
      if(!settled){for(const p of hOverlaps){y=p.bottom+CARD_GAP;if(noOverlapAt(y)){settled=true;break}}}
      if(!settled){y=Math.max(...hOverlaps.map(p=>p.bottom))+CARD_GAP}
    }
    placed.push({left,right,top:y,bottom:y+h,id:ev.id});
    result[i]={...ev,pxTop:y};
  }
  return result;
}

function setSyncStatus(ok,msg){document.getElementById('syncStatus').innerHTML=`<span class="sync-dot ${ok?'sync-ok':'sync-loading'}"></span>${msg}`}
async function firebaseSave(){if(!IS_ADMIN)return;setSyncStatus(false,'保存中...');try{await fetch(DB_URL+'/timeline.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({events,nextId})});setSyncStatus(true,'已同步')}catch(e){setSyncStatus(false,'同步失败')}}
async function firebaseLoad(){setSyncStatus(false,'加载中...');try{const r=await fetch(DB_URL+'/timeline.json');const data=await r.json();if(data&&data.events){events=data.events;if(data.nextId)nextId=data.nextId;setSyncStatus(true,'已同步');return true}}catch(e){setSyncStatus(false,'连接失败')}return false}

async function init(){
  const loaded=await firebaseLoad();
  if(!loaded){events=JSON.parse(JSON.stringify(INITIAL_EVENTS));if(IS_ADMIN)await firebaseSave()}
  buildFilterBar();buildLegend();render();
  setTimeout(()=>{document.getElementById('timelineScroll').scrollLeft=Math.max(0,dateToPos(new Date().toISOString().slice(0,10))-200)},100);
  setInterval(async()=>{if(!dragState){await firebaseLoad();render()}},POLL_INTERVAL);
}

function showPanel(name){['editPanel','addPanel'].forEach(id=>document.getElementById(id).classList.remove('visible'));if(name)document.getElementById(name+'Panel').classList.add('visible')}

function buildFilterBar(){
  const bar=document.getElementById('filterBar');let h='';
  FILTERS.forEach(f=>{const c=f.key==='all'?'#94a3b8':TYPES[f.key].color;h+=`<button class="filter-btn${filter===f.key?' active':''}" data-filter="${f.key}"><span class="filter-dot" style="background:${c}"></span>${f.label}</button>`});
  if(IS_ADMIN){h+=`<button class="btn-add" id="addBtn">+ 添加</button>`;h+=`<button class="filter-btn" id="resetBtn" style="margin-left:2px">重置</button>`}
  bar.innerHTML=h;
  bar.querySelectorAll('.filter-btn[data-filter]').forEach(b=>{b.addEventListener('click',()=>{filter=b.dataset.filter;buildFilterBar();render()})});
  if(IS_ADMIN){
    document.getElementById('resetBtn').addEventListener('click',async()=>{if(!confirm('重置将恢复所有事件到初始状态，确定吗？'))return;events=JSON.parse(JSON.stringify(INITIAL_EVENTS));nextId=100;selectedId=null;deleteId=null;showPanel(null);await firebaseSave();render()});
    document.getElementById('addBtn').addEventListener('click',()=>{showPanel('add');document.getElementById('addDate').value='';document.getElementById('addLabel').value='';document.getElementById('addType').value='dev';document.getElementById('addFixed').checked=false;document.getElementById('addImportant').checked=false;document.getElementById('addNote').value=''});
  }
}

function buildLegend(){
  const bar=document.getElementById('legendBar');let h='';
  Object.entries(TYPES).forEach(([k,t])=>{h+=`<span class="legend-item"><span class="legend-dot" style="background:${t.color}"></span> ${t.label}</span>`});
  h+=`<span class="legend-item"><span class="legend-lock"></span> 锁定</span>`;
  h+=IS_ADMIN?`<span class="save-note">改动自动同步至云端</span>`:`<span class="save-note">每15秒自动刷新</span>`;
  bar.innerHTML=h;
}

function render(){
  const canvas=document.getElementById("timelineCanvas"),listC=document.getElementById("eventListContainer");
  const months=getMonths(),filtered=getFiltered();
  const heights=measureCardHeights(filtered);
  const positioned=layoutEvents(filtered,heights);
  const maxBottom=positioned.reduce((m,e)=>Math.max(m,e.pxTop+heights[e.id]),0);
  const th=Math.max(400,maxBottom+100);
  canvas.style.width=TOTAL_WIDTH+"px";canvas.style.minHeight=th+"px";

  let html='<div class="month-bar">';const today=new Date();
  months.forEach(m=>{const ms=daysBetween(START,m);const nm=new Date(m.getFullYear(),m.getMonth()+1,1);const me=daysBetween(START,nm>END?END:nm);const l=(ms/TOTAL_DAYS)*TOTAL_WIDTH,w=((me-ms)/TOTAL_DAYS)*TOTAL_WIDTH;const ic=today.getFullYear()===m.getFullYear()&&today.getMonth()===m.getMonth();const yp=m.getFullYear()===2027?"2027 ":"";html+=`<div class="month-label${ic?' current':''}" style="left:${l}px;width:${w}px">${yp}${MONTH_NAMES[m.getMonth()]}</div>`});
  html+='</div>';
  months.forEach(m=>{const l=(daysBetween(START,m)/TOTAL_DAYS)*TOTAL_WIDTH;html+=`<div class="grid-line" style="left:${l}px;bottom:0"></div>`});
  const ts=today.toISOString().slice(0,10),tp=dateToPos(ts);
  if(tp>0&&tp<TOTAL_WIDTH){html+=`<div class="today-line" style="left:${tp}px"></div><div class="today-label" style="left:${tp-20}px">今天</div>`}

  html+='<div style="position:relative;padding-top:60px">';
  positioned.forEach(ev=>{
    const pos=dateToPos(ev.date),t=TYPES[ev.type];
    const canDrag=IS_ADMIN;
    const cls=['event-node',canDrag?'draggable':'',selectedId===ev.id?'selected':''].filter(Boolean).join(' ');
    const ds=`border-color:${t.color};${ev.important?`background:${t.color};box-shadow:0 0 8px ${t.color}50;`:'background:transparent;'}`;
    const cbs=ev.fixed?'dashed':'solid';const cbc=selectedId===ev.id?'#f59e0b':`${t.color}40`;
    html+=`<div class="${cls}" data-id="${ev.id}" style="left:${pos-4}px;top:${ev.pxTop}px">`;
    html+=`<div class="event-stem" style="background:${t.color}"></div><div class="event-dot" style="${ds}"></div>`;
    html+=`<div class="event-card" style="background:${t.bg};border:1px ${cbs} ${cbc}">`;
    html+=`<div class="date-label">${formatDate(ev.date)}<span class="type-badge" style="background:${t.badgeBg};color:${t.color}">${t.label}</span>${ev.fixed?'<span class="lock-icon">🔒</span>':''}</div>`;
    html+=`<div class="event-title${ev.important?' important':''}">${ev.label}</div>`;
    if(ev.note)html+=`<div class="event-note">${ev.note}</div>`;
    html+=`</div></div>`;
  });
  html+='</div>';canvas.innerHTML=html;

  let lh='';
  filtered.forEach(ev=>{
    const t=TYPES[ev.type],isSel=selectedId===ev.id;
    lh+=`<div class="list-row${isSel?' selected-row':''}" data-id="${ev.id}">`;
    lh+=`<span class="list-dot" style="background:${t.color}"></span>`;
    lh+=`<span class="list-badge" style="background:${t.badgeBg};color:${t.color}">${t.label}</span>`;
    const dateClass=IS_ADMIN&&!ev.fixed?'editable':'locked';
    lh+=`<span class="list-date ${dateClass}" data-id="${ev.id}">${formatDate(ev.date)}</span>`;
    const labelClass=IS_ADMIN?'editable-label':'';
    lh+=`<span class="list-label${ev.important?' important':''} ${labelClass}" data-edit-id="${ev.id}">${ev.label}</span>`;
    if(ev.fixed)lh+=`<span style="font-size:9px;color:#f59e0b">🔒</span>`;
    if(ev.note)lh+=`<span class="list-note">(${ev.note})</span>`;
    if(IS_ADMIN)lh+=`<button class="btn-del" data-del-id="${ev.id}" title="删除">×</button>`;
    lh+=`</div>`;
  });
  listC.innerHTML=lh;

  if(IS_ADMIN){
    document.querySelectorAll('.event-node.draggable').forEach(el=>{el.addEventListener('mousedown',onDragStart);el.addEventListener('touchstart',onTouchStart,{passive:false})});
    document.querySelectorAll('.list-date.editable').forEach(el=>{el.addEventListener('click',()=>openEdit(parseInt(el.dataset.id)))});
    document.querySelectorAll('.list-label.editable-label').forEach(el=>{el.addEventListener('click',()=>openEdit(parseInt(el.dataset.editId)))});
    document.querySelectorAll('.event-node.draggable .event-card').forEach(el=>{el.addEventListener('click',()=>{if(dragState&&dragState.moved)return;openEdit(parseInt(el.closest('.event-node').dataset.id))})});
    document.querySelectorAll('.btn-del').forEach(el=>{el.addEventListener('click',(e)=>{e.stopPropagation();openDelete(parseInt(el.dataset.delId))})});
  }
}

function openEdit(id){
  if(!IS_ADMIN)return;
  const ev=events.find(e=>e.id===id);
  if(!ev)return;
  selectedId=id;deleteId=null;showPanel('edit');
  const dateEl=document.getElementById('editDateInput'),fxEl=document.getElementById('editFixed');
  dateEl.value=ev.date;
  fxEl.checked=!!ev.fixed;
  dateEl.disabled=fxEl.checked;
  fxEl.onchange=()=>{dateEl.disabled=fxEl.checked};
  document.getElementById('editLabelInput').value=ev.label;
  document.getElementById('editType').value=ev.type;
  document.getElementById('editImportant').checked=!!ev.important;
  document.getElementById('editNoteInput').value=ev.note||'';
  render();
}
async function openDelete(id){if(!IS_ADMIN)return;const ev=events.find(e=>e.id===id);if(!ev)return;if(!confirm(`确认删除"${ev.label}"（${formatDate(ev.date)}）？`))return;events=events.filter(e=>e.id!==id);await firebaseSave();render()}
function closeAll(){selectedId=null;showPanel(null);render()}

function onDragStart(e){if(!IS_ADMIN)return;const el=e.currentTarget,id=parseInt(el.dataset.id);const ev=events.find(e=>e.id===id);e.preventDefault();const isFixed=ev.fixed;const currentTop=parseInt(el.style.top)||0;dragState={id,startX:e.clientX,startY:e.clientY,startPos:dateToPos(ev.date),startTop:currentTop,moved:false,isFixed};el.classList.add('dragging');document.addEventListener('mousemove',onDragMove);document.addEventListener('mouseup',onDragEnd)}
function onDragMove(e){if(!dragState)return;const dx=e.clientX-dragState.startX,dy=e.clientY-dragState.startY;if(Math.abs(dx)>3||Math.abs(dy)>3)dragState.moved=true;const el=document.querySelector(`.event-node[data-id="${dragState.id}"]`);if(!el)return;let newPos=dragState.startPos;if(!dragState.isFixed){newPos=Math.max(0,Math.min(TOTAL_WIDTH,dragState.startPos+dx));const nd=posToDate(newPos);events=events.map(ev=>ev.id===dragState.id?{...ev,date:nd}:ev);const dl=el.querySelector('.date-label');if(dl){const ev=events.find(e=>e.id===dragState.id),t=TYPES[ev.type];dl.innerHTML=`${formatDate(nd)}<span class="type-badge" style="background:${t.badgeBg};color:${t.color}">${t.label}</span>${ev.fixed?'<span class="lock-icon">🔒</span>':''}`}}const rawTop=Math.max(0,dragState.startTop+dy);const snappedTop=Math.round(rawTop/DRAG_SNAP)*DRAG_SNAP;events=events.map(ev=>ev.id===dragState.id?{...ev,customTop:snappedTop}:ev);el.style.left=((!dragState.isFixed?newPos:dateToPos(events.find(e=>e.id===dragState.id).date))-4)+'px';el.style.top=snappedTop+'px';el.style.transition='none'}
function onDragEnd(){if(dragState){const el=document.querySelector(`.event-node[data-id="${dragState.id}"]`);if(el)el.classList.remove('dragging')}document.removeEventListener('mousemove',onDragMove);document.removeEventListener('mouseup',onDragEnd);const wm=dragState?.moved;dragState=null;if(wm){firebaseSave();render()}}
function onTouchStart(e){if(!IS_ADMIN)return;const el=e.currentTarget,id=parseInt(el.dataset.id);const ev=events.find(e=>e.id===id);const t=e.touches[0];const isFixed=ev.fixed;const currentTop=parseInt(el.style.top)||0;dragState={id,startX:t.clientX,startY:t.clientY,startPos:dateToPos(ev.date),startTop:currentTop,moved:false,isFixed};el.classList.add('dragging');document.addEventListener('touchmove',onTouchMove,{passive:false});document.addEventListener('touchend',onTouchEnd)}
function onTouchMove(e){if(!dragState)return;e.preventDefault();const t=e.touches[0],dx=t.clientX-dragState.startX,dy=t.clientY-dragState.startY;if(Math.abs(dx)>3||Math.abs(dy)>3)dragState.moved=true;const el=document.querySelector(`.event-node[data-id="${dragState.id}"]`);if(!el)return;let newPos=dragState.startPos;if(!dragState.isFixed){newPos=Math.max(0,Math.min(TOTAL_WIDTH,dragState.startPos+dx));const nd=posToDate(newPos);events=events.map(ev=>ev.id===dragState.id?{...ev,date:nd}:ev)}const rawTop=Math.max(0,dragState.startTop+dy);const snappedTop=Math.round(rawTop/DRAG_SNAP)*DRAG_SNAP;events=events.map(ev=>ev.id===dragState.id?{...ev,customTop:snappedTop}:ev);el.style.left=((!dragState.isFixed?newPos:dateToPos(events.find(e=>e.id===dragState.id).date))-4)+'px';el.style.top=snappedTop+'px';el.style.transition='none'}
function onTouchEnd(){document.removeEventListener('touchmove',onTouchMove);document.removeEventListener('touchend',onTouchEnd);dragState=null;firebaseSave();render()}

// Edit: save date + label + note
document.getElementById('editConfirm').addEventListener('click',async()=>{
  if(!selectedId)return;
  const nd=document.getElementById('editDateInput').value;
  const nl=document.getElementById('editLabelInput').value.trim();
  const nn=document.getElementById('editNoteInput').value.trim();
  const nf=document.getElementById('editFixed').checked;
  const nt=document.getElementById('editType').value;
  const ni=document.getElementById('editImportant').checked;
  if(!nl){alert('名称不能为空');return}
  events=events.map(ev=>{
    if(ev.id!==selectedId)return ev;
    const updated={...ev,label:nl,date:nd,fixed:nf,type:nt};
    if(ni)updated.important=true;else delete updated.important;
    if(nn)updated.note=nn;else delete updated.note;
    return updated;
  });
  await firebaseSave();closeAll();
});
document.getElementById('editCancel').addEventListener('click',closeAll);

// Add
document.getElementById('addConfirm').addEventListener('click',async()=>{
  const date=document.getElementById('addDate').value,label=document.getElementById('addLabel').value.trim();
  const type=document.getElementById('addType').value,fixed=document.getElementById('addFixed').checked;
  const important=document.getElementById('addImportant').checked,note=document.getElementById('addNote').value.trim();
  if(!date||!label){alert('请填写日期和名称');return}
  const ev={id:nextId++,date,label,type,fixed};if(important)ev.important=true;if(note)ev.note=note;
  events.push(ev);await firebaseSave();showPanel(null);render();
});
document.getElementById('addCancel').addEventListener('click',()=>{showPanel(null)});

init();
</script>
</body>
