<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>无休夏日综合征 · 制作时间线</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0e17;
    color: #e2e8f0;
    font-family: 'Noto Sans SC', system-ui, sans-serif;
    overflow-x: hidden;
  }

  .header {
    padding: 24px 28px 16px;
    border-bottom: 1px solid #1e293b;
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }

  .header h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: #f8fafc;
  }

  .header .subtitle {
    font-size: 12px;
    color: #64748b;
    margin-top: 4px;
  }

  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  .filter-btn {
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 500;
    background: transparent;
    color: #64748b;
    border: 1px solid #1e293b;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }

  .filter-btn.active {
    background: #1e293b;
    color: #f8fafc;
    border-color: #334155;
  }

  .filter-btn:hover { border-color: #334155; }

  .legend {
    display: flex;
    gap: 16px;
    margin-top: 12px;
    font-size: 11px;
    color: #94a3b8;
    flex-wrap: wrap;
    align-items: center;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .legend-lock {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    border: 1.5px dashed #f59e0b;
  }

  /* Edit panel */
  .edit-panel {
    padding: 12px 28px;
    background: #111827;
    border-bottom: 1px solid #1e293b;
    display: none;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    flex-wrap: wrap;
  }

  .edit-panel.visible { display: flex; }

  .edit-panel input[type="date"] {
    background: #1e293b;
    border: 1px solid #334155;
    color: #f8fafc;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 13px;
    font-family: inherit;
  }

  .edit-panel .btn-confirm {
    padding: 4px 14px;
    background: #3b82f6;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
  }

  .edit-panel .btn-cancel {
    padding: 4px 14px;
    background: transparent;
    color: #94a3b8;
    border: 1px solid #334155;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
  }

  /* Timeline container */
  .timeline-scroll {
    overflow-x: auto;
    overflow-y: auto;
    position: relative;
  }

  .timeline-canvas {
    position: relative;
    padding: 0 0 40px;
  }

  /* Month headers */
  .month-bar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: #0a0e17;
    border-bottom: 1px solid #1e293b;
    height: 40px;
  }

  .month-label {
    position: absolute;
    padding: 10px 12px;
    font-size: 13px;
    font-weight: 600;
    color: #64748b;
    border-right: 1px solid #1e293b;
    height: 40px;
  }

  .month-label.current { color: #f8fafc; background: rgba(59,130,246,0.06); }

  /* Grid lines */
  .grid-line {
    position: absolute;
    top: 40px;
    bottom: 0;
    width: 1px;
    background: #1e293b;
  }

  /* Today line */
  .today-line {
    position: absolute;
    top: 36px;
    bottom: 0;
    width: 2px;
    background: linear-gradient(180deg, #f59e0b 0%, rgba(245,158,11,0.1) 100%);
    z-index: 15;
  }

  .today-label {
    position: absolute;
    top: 40px;
    z-index: 16;
    background: #f59e0b;
    color: #000;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 3px;
    white-space: nowrap;
  }

  /* Event nodes */
  .event-node {
    position: absolute;
    z-index: 10;
    user-select: none;
    transition: left 0.3s ease;
  }

  .event-node.dragging {
    z-index: 30;
    transition: none;
  }

  .event-node.draggable { cursor: grab; }
  .event-node.draggable:active { cursor: grabbing; }

  .event-stem {
    position: absolute;
    left: 3px;
    top: -4px;
    width: 2px;
    height: 12px;
    opacity: 0.4;
  }

  .event-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    border-width: 2px;
    border-style: solid;
  }

  .event-card {
    position: absolute;
    top: 14px;
    left: -6px;
    border-radius: 6px;
    padding: 6px 10px;
    min-width: 130px;
    max-width: 180px;
    transition: box-shadow 0.2s, border-color 0.2s;
  }

  .event-node.dragging .event-card {
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }

  .event-card .date-label {
    font-size: 10px;
    color: #64748b;
    margin-bottom: 2px;
    font-family: 'JetBrains Mono', monospace;
  }

  .event-card .event-title {
    font-size: 12px;
    font-weight: 500;
    line-height: 1.4;
  }

  .event-card .event-title.important { font-weight: 700; color: #f8fafc !important; }

  .event-card .event-note {
    font-size: 10px;
    color: #475569;
    margin-top: 2px;
  }

  .lock-icon { margin-left: 4px; color: #f59e0b; font-size: 9px; }

  /* Colors */
  .type-dev .event-stem { background: #3b82f6; }
  .type-dev .event-dot { border-color: #3b82f6; }
  .type-dev .event-card { background: #1a2744; border: 1px solid rgba(59,130,246,0.25); }
  .type-dev .event-title { color: #93c5fd; }
  .type-dev.important-true .event-dot { background: #3b82f6; box-shadow: 0 0 8px rgba(59,130,246,0.3); }

  .type-marketing .event-stem { background: #a855f7; }
  .type-marketing .event-dot { border-color: #a855f7; }
  .type-marketing .event-card { background: #2a1f35; border: 1px solid rgba(168,85,247,0.25); }
  .type-marketing .event-title { color: #d8b4fe; }
  .type-marketing.important-true .event-dot { background: #a855f7; box-shadow: 0 0 8px rgba(168,85,247,0.3); }

  .type-launch .event-stem { background: #ef4444; }
  .type-launch .event-dot { border-color: #ef4444; }
  .type-launch .event-card { background: #3b1c1c; border: 1px solid rgba(239,68,68,0.25); }
  .type-launch .event-title { color: #fca5a5; }
  .type-launch.important-true .event-dot { background: #ef4444; box-shadow: 0 0 8px rgba(239,68,68,0.3); }

  .fixed-true .event-card { border-style: dashed; }
  .selected .event-card { border-color: #f59e0b !important; }

  /* Event list */
  .event-list {
    padding: 20px 28px;
    border-top: 1px solid #1e293b;
  }

  .event-list h2 {
    font-size: 14px;
    font-weight: 600;
    color: #94a3b8;
    margin-bottom: 12px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .list-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 13px;
    transition: background 0.15s;
  }

  .list-row:hover { background: rgba(30,41,59,0.5); }
  .list-row.selected-row { background: #1e293b; }

  .list-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .list-date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    min-width: 50px;
  }

  .list-date.editable {
    color: #94a3b8;
    cursor: pointer;
    text-decoration: underline;
    text-decoration-color: #334155;
    text-underline-offset: 2px;
  }

  .list-date.locked { color: #475569; }

  .list-label { color: #cbd5e1; }
  .list-label.important { color: #f8fafc; font-weight: 600; }
  .list-note { font-size: 11px; color: #475569; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <h1>无休夏日综合征 · 制作时间线</h1>
      <div class="subtitle">Endless Summer Syndrome — Development & Marketing Timeline</div>
    </div>
    <div class="controls">
      <button class="filter-btn active" data-filter="all">全部</button>
      <button class="filter-btn" data-filter="dev">开发</button>
      <button class="filter-btn" data-filter="marketing">宣发</button>
      <button class="filter-btn" id="resetBtn">重置</button>
    </div>
  </div>
  <div class="legend">
    <span class="legend-item"><span class="legend-dot" style="background:#3b82f6"></span> 开发</span>
    <span class="legend-item"><span class="legend-dot" style="background:#a855f7"></span> 宣发</span>
    <span class="legend-item"><span class="legend-dot" style="background:#ef4444"></span> 发售</span>
    <span class="legend-item"><span class="legend-lock"></span> 锁定</span>
    <span style="color:#475569">拖拽非锁定事件可调整日期 · 点击列表日期可精确编辑</span>
  </div>
</div>

<div class="edit-panel" id="editPanel">
  <span style="color:#94a3b8">编辑日期：</span>
  <span id="editLabel" style="color:#f8fafc;font-weight:600"></span>
  <input type="date" id="editDateInput">
  <button class="btn-confirm" id="editConfirm">确认</button>
  <button class="btn-cancel" id="editCancel">取消</button>
</div>

<div class="timeline-scroll" id="timelineScroll">
  <div class="timeline-canvas" id="timelineCanvas"></div>
</div>

<div class="event-list">
  <h2>事件列表 · 点击日期可编辑</h2>
  <div id="eventListContainer"></div>
</div>

<script>
const INITIAL_EVENTS = [
  { id: 1, date: "2026-05-16", label: "商店页Coming Soon上线", type: "marketing", fixed: true },
  { id: 2, date: "2026-05-31", label: "编辑确定并开始工作", type: "dev", fixed: false },
  { id: 3, date: "2026-05-18", label: "杂谈第一批开始发布", type: "marketing", fixed: false, note: "每周一篇，共3-5篇" },
  { id: 4, date: "2026-06-07", label: "Demo完成（除配音外）", type: "dev", fixed: false, important: true },
  { id: 5, date: "2026-06-15", label: "观察六月Next Fest", type: "marketing", fixed: true, note: "6/15-6/22" },
  { id: 6, date: "2026-07-01", label: "宣发美工第一批素材交付", type: "marketing", fixed: false, note: "capsule排版/社媒模板" },
  { id: 7, date: "2026-07-15", label: "全本剧本定稿", type: "dev", fixed: false },
  { id: 8, date: "2026-08-15", label: "CV选定确认", type: "dev", fixed: false },
  { id: 9, date: "2026-08-28", label: "Demo配音完成", type: "dev", fixed: false },
  { id: 10, date: "2026-08-31", label: "Trailer完成", type: "dev", fixed: false },
  { id: 11, date: "2026-09-01", label: "Curator软接触开始", type: "marketing", fixed: false },
  { id: 12, date: "2026-09-07", label: "Steam拉取trailer", type: "dev", fixed: true, note: "硬性deadline" },
  { id: 13, date: "2026-09-14", label: "itch.io demo上线", type: "marketing", fixed: false, note: "前哨站" },
  { id: 14, date: "2026-09-21", label: "Demo build提交Steam审核", type: "dev", fixed: true, note: "Press Preview" },
  { id: 15, date: "2026-09-25", label: "宣发美工第二批素材交付", type: "marketing", fixed: false, note: "Next Fest物料" },
  { id: 16, date: "2026-10-01", label: "Curator正式发key", type: "marketing", fixed: false },
  { id: 17, date: "2026-10-05", label: "Next Fest素材最终提交", type: "dev", fixed: true, note: "硬性deadline" },
  { id: 18, date: "2026-10-19", label: "★ Steam Next Fest", type: "marketing", fixed: true, important: true, note: "10/19-10/26 全力运营" },
  { id: 19, date: "2026-10-28", label: "Next Fest复盘+杂谈第二批", type: "marketing", fixed: false },
  { id: 20, date: "2026-11-15", label: "全部美术完成", type: "dev", fixed: false },
  { id: 21, date: "2026-11-24", label: "音乐创作完成→混音母带", type: "dev", fixed: true, note: "与Kevin约定" },
  { id: 22, date: "2026-12-01", label: "正式版review key发送", type: "marketing", fixed: false, note: "KOL/curator" },
  { id: 23, date: "2026-12-15", label: "全部配音完成", type: "dev", fixed: false },
  { id: 24, date: "2026-12-28", label: "正式版内容完成", type: "dev", fixed: false, important: true },
  { id: 25, date: "2027-01-05", label: "混音母带完成+正式版送审", type: "dev", fixed: true, important: true },
  { id: 26, date: "2027-01-08", label: "发售倒计时宣传", type: "marketing", fixed: false, note: "社媒+杂谈收尾" },
  { id: 27, date: "2027-01-19", label: "🚀 发售", type: "launch", fixed: true, important: true },
];

let events = JSON.parse(JSON.stringify(INITIAL_EVENTS));
let filter = "all";
let selectedId = null;
let dragState = null;

const START = new Date("2026-05-01");
const END = new Date("2027-02-01");
const TOTAL_DAYS = Math.ceil((END - START) / 86400000);
const TOTAL_WIDTH = 2400;
const ROW_HEIGHT = 56;
const CARD_MIN_SPACING = 155;

const MONTH_NAMES = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];

function daysBetween(a, b) { return Math.ceil((b - a) / 86400000); }
function dateToPos(d) { return (daysBetween(START, new Date(d)) / TOTAL_DAYS) * TOTAL_WIDTH; }
function posToDate(x) {
  const days = Math.round((x / TOTAL_WIDTH) * TOTAL_DAYS);
  const d = new Date(START);
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}
function formatDate(s) {
  const d = new Date(s + "T00:00:00");
  return `${d.getMonth() + 1}/${d.getDate()}`;
}

function getMonths() {
  const months = [];
  let cur = new Date(START);
  while (cur < END) {
    months.push(new Date(cur));
    cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1);
  }
  return months;
}

function getFilteredEvents() {
  return events.filter(ev => {
    if (filter === "all") return true;
    if (ev.type === "launch") return true;
    return ev.type === filter;
  }).sort((a, b) => a.date.localeCompare(b.date));
}

function assignRows(evts) {
  const rows = [];
  return evts.map(ev => {
    const pos = dateToPos(ev.date);
    let row = 0;
    while (rows[row] !== undefined && pos - rows[row] < CARD_MIN_SPACING) row++;
    rows[row] = pos;
    return { ...ev, row };
  });
}

function render() {
  const canvas = document.getElementById("timelineCanvas");
  const listContainer = document.getElementById("eventListContainer");
  const months = getMonths();
  const filtered = getFilteredEvents();
  const positioned = assignRows(filtered);
  const maxRow = positioned.reduce((m, e) => Math.max(m, e.row), 0);
  const timelineHeight = Math.max(500, (maxRow + 1) * ROW_HEIGHT + 100);

  canvas.style.width = TOTAL_WIDTH + "px";
  canvas.style.minHeight = timelineHeight + "px";

  let html = '';

  // Month bar
  html += '<div class="month-bar">';
  const today = new Date();
  months.forEach(m => {
    const mStart = daysBetween(START, m);
    const nextM = new Date(m.getFullYear(), m.getMonth() + 1, 1);
    const mEnd = daysBetween(START, nextM > END ? END : nextM);
    const left = (mStart / TOTAL_DAYS) * TOTAL_WIDTH;
    const width = ((mEnd - mStart) / TOTAL_DAYS) * TOTAL_WIDTH;
    const isCurrent = today.getFullYear() === m.getFullYear() && today.getMonth() === m.getMonth();
    const yearPrefix = m.getFullYear() === 2027 ? "2027 " : "";
    html += `<div class="month-label${isCurrent ? ' current' : ''}" style="left:${left}px;width:${width}px">${yearPrefix}${MONTH_NAMES[m.getMonth()]}</div>`;
  });
  html += '</div>';

  // Grid lines
  months.forEach(m => {
    const left = (daysBetween(START, m) / TOTAL_DAYS) * TOTAL_WIDTH;
    html += `<div class="grid-line" style="left:${left}px;bottom:0"></div>`;
  });

  // Today line
  const todayStr = today.toISOString().slice(0, 10);
  const todayPos = dateToPos(todayStr);
  if (todayPos > 0 && todayPos < TOTAL_WIDTH) {
    html += `<div class="today-line" style="left:${todayPos}px"></div>`;
    html += `<div class="today-label" style="left:${todayPos - 20}px">今天</div>`;
  }

  // Events
  html += '<div style="position:relative;padding-top:60px">';
  positioned.forEach(ev => {
    const pos = dateToPos(ev.date);
    const classes = [
      'event-node',
      `type-${ev.type}`,
      `fixed-${ev.fixed}`,
      `important-${!!ev.important}`,
      ev.fixed ? '' : 'draggable',
      selectedId === ev.id ? 'selected' : '',
    ].filter(Boolean).join(' ');

    const dotBg = ev.important ? '' : 'background:transparent;';

    html += `<div class="${classes}" data-id="${ev.id}" style="left:${pos - 4}px;top:${ev.row * ROW_HEIGHT}px">`;
    html += `<div class="event-stem"></div>`;
    html += `<div class="event-dot" style="${dotBg}"></div>`;
    html += `<div class="event-card">`;
    html += `<div class="date-label">${formatDate(ev.date)}${ev.fixed ? '<span class="lock-icon">🔒</span>' : ''}</div>`;
    html += `<div class="event-title${ev.important ? ' important' : ''}">${ev.label}</div>`;
    if (ev.note) html += `<div class="event-note">${ev.note}</div>`;
    html += `</div></div>`;
  });
  html += '</div>';

  canvas.innerHTML = html;

  // Event list
  let listHtml = '';
  const dotColors = { dev: '#3b82f6', marketing: '#a855f7', launch: '#ef4444' };
  filtered.forEach(ev => {
    const isSelected = selectedId === ev.id;
    listHtml += `<div class="list-row${isSelected ? ' selected-row' : ''}" data-id="${ev.id}">`;
    listHtml += `<span class="list-dot" style="background:${dotColors[ev.type]}"></span>`;
    listHtml += `<span class="list-date ${ev.fixed ? 'locked' : 'editable'}" data-action="edit" data-id="${ev.id}">${formatDate(ev.date)}</span>`;
    listHtml += `<span class="list-label${ev.important ? ' important' : ''}">${ev.label}</span>`;
    if (ev.fixed) listHtml += `<span style="font-size:9px;color:#f59e0b">🔒</span>`;
    if (ev.note) listHtml += `<span class="list-note">(${ev.note})</span>`;
    listHtml += `</div>`;
  });
  listContainer.innerHTML = listHtml;

  // Bind drag events
  document.querySelectorAll('.event-node.draggable').forEach(el => {
    el.addEventListener('mousedown', onDragStart);
    el.addEventListener('touchstart', onTouchStart, { passive: false });
  });

  // Bind list edit clicks
  document.querySelectorAll('.list-date.editable').forEach(el => {
    el.addEventListener('click', () => {
      const id = parseInt(el.dataset.id);
      openEdit(id);
    });
  });

  // Bind card clicks for editing
  document.querySelectorAll('.event-node.draggable .event-card').forEach(el => {
    el.addEventListener('click', (e) => {
      if (dragState && dragState.moved) return;
      const id = parseInt(el.closest('.event-node').dataset.id);
      openEdit(id);
    });
  });
}

function openEdit(id) {
  const ev = events.find(e => e.id === id);
  if (!ev || ev.fixed) return;
  selectedId = id;
  const panel = document.getElementById('editPanel');
  panel.classList.add('visible');
  document.getElementById('editLabel').textContent = ev.label;
  document.getElementById('editDateInput').value = ev.date;
  render();
}

function closeEdit() {
  selectedId = null;
  document.getElementById('editPanel').classList.remove('visible');
  render();
}

// Drag handling
function onDragStart(e) {
  const el = e.currentTarget;
  const id = parseInt(el.dataset.id);
  const ev = events.find(e => e.id === id);
  if (ev.fixed) return;
  e.preventDefault();
  dragState = {
    id,
    startX: e.clientX,
    startPos: dateToPos(ev.date),
    moved: false,
  };
  el.classList.add('dragging');
  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('mouseup', onDragEnd);
}

function onDragMove(e) {
  if (!dragState) return;
  const dx = e.clientX - dragState.startX;
  if (Math.abs(dx) > 3) dragState.moved = true;
  const newPos = Math.max(0, Math.min(TOTAL_WIDTH, dragState.startPos + dx));
  const newDate = posToDate(newPos);
  const el = document.querySelector(`.event-node[data-id="${dragState.id}"]`);
  if (el) {
    el.style.left = (newPos - 4) + 'px';
    el.style.transition = 'none';
    const dateLabel = el.querySelector('.date-label');
    if (dateLabel) dateLabel.textContent = formatDate(newDate) + (events.find(e=>e.id===dragState.id).fixed ? ' 🔒' : '');
  }
  events = events.map(ev => ev.id === dragState.id ? { ...ev, date: newDate } : ev);
}

function onDragEnd() {
  if (dragState) {
    const el = document.querySelector(`.event-node[data-id="${dragState.id}"]`);
    if (el) el.classList.remove('dragging');
  }
  document.removeEventListener('mousemove', onDragMove);
  document.removeEventListener('mouseup', onDragEnd);
  const wasMoved = dragState?.moved;
  dragState = null;
  if (wasMoved) render();
}

// Touch handling
function onTouchStart(e) {
  const el = e.currentTarget;
  const id = parseInt(el.dataset.id);
  const ev = events.find(e => e.id === id);
  if (ev.fixed) return;
  const touch = e.touches[0];
  dragState = {
    id,
    startX: touch.clientX,
    startPos: dateToPos(ev.date),
    moved: false,
  };
  el.classList.add('dragging');
  document.addEventListener('touchmove', onTouchMove, { passive: false });
  document.addEventListener('touchend', onTouchEnd);
}

function onTouchMove(e) {
  if (!dragState) return;
  e.preventDefault();
  const touch = e.touches[0];
  const dx = touch.clientX - dragState.startX;
  if (Math.abs(dx) > 3) dragState.moved = true;
  const newPos = Math.max(0, Math.min(TOTAL_WIDTH, dragState.startPos + dx));
  const newDate = posToDate(newPos);
  const el = document.querySelector(`.event-node[data-id="${dragState.id}"]`);
  if (el) {
    el.style.left = (newPos - 4) + 'px';
    el.style.transition = 'none';
  }
  events = events.map(ev => ev.id === dragState.id ? { ...ev, date: newDate } : ev);
}

function onTouchEnd() {
  document.removeEventListener('touchmove', onTouchMove);
  document.removeEventListener('touchend', onTouchEnd);
  dragState = null;
  render();
}

// Filter buttons
document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
  btn.addEventListener('click', () => {
    filter = btn.dataset.filter;
    document.querySelectorAll('.filter-btn[data-filter]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  });
});

// Reset
document.getElementById('resetBtn').addEventListener('click', () => {
  events = JSON.parse(JSON.stringify(INITIAL_EVENTS));
  selectedId = null;
  closeEdit();
  render();
});

// Edit panel
document.getElementById('editConfirm').addEventListener('click', () => {
  const newDate = document.getElementById('editDateInput').value;
  if (newDate && selectedId) {
    events = events.map(ev => ev.id === selectedId ? { ...ev, date: newDate } : ev);
    closeEdit();
  }
});

document.getElementById('editCancel').addEventListener('click', closeEdit);

// Initial render
render();

// Scroll to today
setTimeout(() => {
  const scroll = document.getElementById('timelineScroll');
  const todayPos = dateToPos(new Date().toISOString().slice(0, 10));
  scroll.scrollLeft = Math.max(0, todayPos - 200);
}, 100);
</script>
